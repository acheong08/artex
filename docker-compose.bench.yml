# ARTEX Tencent TSec Benchmark image — build and run locally with one command.
# Independent of the production docker-compose.yml (multiple services: artex + postgres).
# Usage:
#   cp bench/.env.example bench/.env   # Set LLM_API_KEY / BENCHMARK_TOKEN, etc.
#   docker compose -f docker-compose.bench.yml up --build      # Build and run in the foreground (view logs)
#   docker compose -f docker-compose.bench.yml up --build -d   # Run in the background
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # Stop (add -v to remove data volumes too)
# Open http://localhost:8787 in a browser (sign in with ADMIN_PASSWORD)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # Share the host's network stack so the container can reach targets on the host/VPN.
    # Host mode does not use port mappings. The container binds directly to host ports:
    # 8787 (UI/API), 8788 (proxy), and 5432 (internal PostgreSQL). Ensure all three are free
    # on the host (stop any services using them before local testing).
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
